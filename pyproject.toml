[project]
name = "telecom-support-agent"
version = "0.1.0"
description = "Agentic telecom support triage & escalation assistant (Azure AI Foundry primary)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    # web / api
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    # models & validation
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    # orchestration
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # retrieval
    "faiss-cpu>=1.8.0",
    "rank-bm25>=0.2.2",
    "numpy>=1.26",
    # llm providers
    "azure-ai-inference>=1.0.0b4",
    # persistence
    "SQLAlchemy>=2.0.30",
    # http client (ui -> api, health probes)
    "httpx>=0.27",
    "pynacl>=1.5.0",             # Discord webhook signature verification
    # observability
    "azure-monitor-opentelemetry>=1.6.0",
    "opentelemetry-instrumentation-fastapi>=0.47b0",
    "prometheus-client>=0.20",
    # config
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.36",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telecom_agent"]

# ---------------------------------------------------------------------------
# Tooling config — single source of truth for lint / type / test
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "ui", "evals", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["telecom_agent"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end wiring with fake external services",
    "unit: single unit under test",
]

[tool.coverage.run]
source = ["telecom_agent"]
branch = true
