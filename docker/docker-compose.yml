# Local stack: api + ui. Defaults to the fake provider so `docker compose up` works with
# zero credentials. Override LLM_PROVIDER (and the provider creds) via a .env file at the
# repo root to exercise the real providers.
#
#   cd docker && docker compose up --build
#
# The data/ directory is mounted so the FAISS index and SQLite DB survive restarts.

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    image: telecom-agent-api:local
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      API_KEY: ${API_KEY:-dev-key-change-me}
      INDEX_DIR: ./data/index
      DATABASE_URL: sqlite:///./data/app.db
      # Real-provider creds (ignored in fake mode):
      AZURE_AI_ENDPOINT: ${AZURE_AI_ENDPOINT:-}
      AZURE_AI_API_KEY: ${AZURE_AI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      APPLICATIONINSIGHTS_CONNECTION_STRING: ${APPLICATIONINSIGHTS_CONNECTION_STRING:-}
    volumes:
      - ../data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  ui:
    build:
      context: ..
      dockerfile: docker/Dockerfile.ui
    image: telecom-agent-ui:local
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: ${API_KEY:-dev-key-change-me}
    depends_on:
      api:
        condition: service_healthy
