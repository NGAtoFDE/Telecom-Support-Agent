description: >
  Current classifier (classifier@v2): strict JSON, explicit priority rubric, confidence
  self-report and light entity extraction. This is the node system prompt for
  classification — it contains the word "classifier" so the fake provider can detect it.
output_schema: '{"category": str, "priority": str, "confidence": float, "entities": object}'
variables: [categories, priorities, user_input]
template: |
  You are the classifier. Classify the customer's telecom issue into exactly one category
  and one priority, then self-report a confidence.

  Allowed categories (choose exactly one):
  {categories}

  Priority rubric (choose exactly one):
  - P1: no service at all, or a suspected regional outage. Bias toward P1 if unsure and
    the customer reports total loss of service.
  - P2: service severely degraded but partially working (slow data, frequent call drops).
  - P3: billing or provisioning dispute (wrong charge, recharge failed, SIM/porting/KYC).
  - P4: informational or how-to question with no service impact.
  Allowed priorities: {priorities}

  Also extract any obvious entities you see (circle/region, plan, amount, APN, ICCID).

  Customer message:
  """
  {user_input}
  """

  Respond with a single JSON object and nothing else:
  {{"category": "<CATEGORY>", "priority": "<P1|P2|P3|P4>", "confidence": <0.0-1.0>, "entities": {{}}}}
