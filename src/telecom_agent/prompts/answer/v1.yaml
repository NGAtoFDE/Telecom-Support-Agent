description: >
  Answer generation. Citation-mandatory, refuse-if-unsupported. Cites chunk ids that
  appear in the provided context only.
variables: [user_input, context]
template: |
  Using ONLY the knowledge-base context below, write a short, practical resolution for the
  customer's issue. Requirements:
  - Every factual claim or step must be supported by the context.
  - Cite the supporting source inline using its id and section, e.g. [KB-114 §2.3].
  - If the context does not contain enough to resolve the issue, reply with exactly:
    "I don't have an approved source for this — routing you to a specialist."
  - Do not invent steps, prices, timelines or policies.

  Knowledge-base context:
  """
  {context}
  """

  Customer message:
  """
  {user_input}
  """

  Answer:
